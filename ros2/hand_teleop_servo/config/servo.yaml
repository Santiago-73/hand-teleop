# MoveIt Servo params, based on moveit_servo/config/panda_simulated_config.yaml

publish_period: 0.01  # 100 Hz
max_expected_latency: 0.1

command_in_type: "speed_units"
scale:
  # in pose tracking these are the max speeds. Demo uses 0.4 m/s, felt too jumpy with a shaky hand
  linear: 0.25       # m/s
  rotational: 0.6    # rad/s
  joint: 0.5

# the bridge stops publishing when it loses the hand, so Servo stops after this
incoming_command_timeout: 0.2

pose_tracking:
  linear_tolerance: 0.003    # m
  angular_tolerance: 0.02    # rad

command_out_type: trajectory_msgs/JointTrajectory
publish_joint_positions: true
publish_joint_velocities: true
publish_joint_accelerations: false

use_smoothing: true
smoothing_filter_plugin_name: "online_signal_smoothing::AccelerationLimitedPlugin"

is_primary_planning_scene_monitor: true
check_octomap_collisions: false

move_group_name: panda_arm

lower_singularity_threshold: 10.0
hard_stop_singularity_threshold: 30.0
leaving_singularity_threshold_multiplier: 2.0
joint_limit_margins: [0.12]

pose_command_in_topic: ~/pose_target_cmds
cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic: ~/delta_joint_cmds
joint_topic: /joint_states
status_topic: ~/status
command_out_topic: /panda_arm_controller/joint_trajectory

check_collisions: true
collision_check_rate: 10.0
self_collision_proximity_threshold: 0.01
scene_collision_proximity_threshold: 0.02
